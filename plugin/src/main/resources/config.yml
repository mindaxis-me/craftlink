# CraftLink Configuration

# WebSocket server port
ws-port: 4800

# Auto-start viewer streaming when the plugin enables.
auto-start: true

# Default anchor player (empty = first player to join)
anchor-player: ""

# Players whose surroundings should be streamed for multi-viewport.
# ['*'] = every online player in the anchor player's world.
tracked-players:
  - "*"

# View distance in chunks (how far around anchor to send)
view-distance: 8

# Position update interval in milliseconds
position-interval-ms: 50

# Max history buffer size (subchunks kept for late-joining clients)
max-history: 2048

# Optional bearer token required for bridge/WebSocket clients.
auth-token: ""

# Compress binary subchunk frames with gzip before WS broadcast.
compress-binary-chunks: true

# Optional root directory for same-host shared-data mirrors and action IPC files.
# Leave empty to use the plugin data folder. Set to /dev/shm/craftlink on Linux for tmpfs-backed IO.
shared-data-root: ""

# Enable filesystem mirrors for chunk/entity snapshots and file-based action IPC.
shared-data-enabled: true

# Full tracked-chunk shared-data refresh interval (ticks). 20 ticks = 1 second.
shared-data-refresh-interval-ticks: 600

portal:
  enabled: true
  token: ""
